<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tutti a Scuola da Sturla</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* RESET FONDAMENTALE PER CELLULARE */
    * {
      box-sizing: border-box; 
    }
 
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      /*overflow: hidden; */
    }
 
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #0b2a4a, #123e6d, #eaf4ff);
      color: white;
      display: flex;
      flex-direction: column;
    }
 
    .hero { 
      width: 100%;
      padding: 10px; 
      text-align: center; 
      background: #0b2a4a; 
      border-bottom: 2px solid #f2c200; 
      flex-shrink: 0;
    }
 
    .hero h1 { margin: 0; font-size: 18px; }
    .hero span { color: #f2c200; }
 
    #app { 
      width: 100%;
      max-width: 800px; 
      margin: 0 auto; 
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
 
    .main-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      width: 100%;
    }
 
    /* GRIGLIA PULSANTI OTTIMIZZATA */
    #pulsanti {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px; /* Ridotto il gap per risparmiare spazio */
      margin-bottom: 10px;
      flex-shrink: 0;
    }
 
    #pulsanti button {
      background: linear-gradient(#f2c200, #d9a900);
      color: #0b2a4a;
      border: none;
      border-radius: 6px;
      padding: 8px 1px;
      font-size: 11px; /* Font leggermente più piccolo per evitare sforamenti */
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap; /* Evita che il testo vada a capo rompendo l'altezza */
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    #cronaca {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #0b2a4a;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0; 
      width: 100%;
    }
 
    #cronaca p {
      margin: 4px 0;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      border-left: 5px solid #ffffff;
      animation: flashEntry 0.6s ease-out;
      flex-shrink: 0;
      word-wrap: break-word; /* Evita che testi lunghi escano dalla cronaca */
    }
 
    @keyframes flashEntry {
      0% { background-color: #444; }
      100% { background-color: transparent; }
    }
 
    /* SCELTA POLIGONI */
    .poligoni-scelta {
      margin-bottom: 16px;
    }
 
    .poligoni-scelta p {
      margin: 0 0 8px 0;
      font-weight: bold;
      font-size: 14px;
    }
 
    .poligoni-opzioni {
      display: flex;
      gap: 10px;
    }
 
    .poligoni-opzioni button {
      flex: 1;
      padding: 12px;
      border: 2px solid #f2c200;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
 
    .poligoni-opzioni button.selezionato {
      background: #f2c200;
      color: #0b2a4a;
    }
 
    /* OVERLAY E SETUP */
    .hidden { display: none !important; }
    .btn-start { background: #0b2a4a; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    .giocatore-row { display: flex; gap: 5px; margin-bottom: 8px; width: 100%; }
    .giocatore-row input { flex: 1; padding: 10px; border-radius: 5px; border: none; min-width: 0; }
    .select-colore { width: 200px; border-radius: 5px; border: 1px solid white; color: #000000; }
 
    .select-colore option {
      background-color: transparent; /* Rimuove il colore di sfondo predefinito */
      border: none; /* Rimuove il bordo predefinito */
      color: white; /* Colore del testo */
      padding: 10px;
    }
 
    .select-colore option:hover {
      background-color: #333; /* Colore di hover per migliorare l'interazione */
    }
 
    .select-colore option {
      padding-left: 10px; /* Distanza tra il quadrato e il nome del colore */
    }
 
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
    .overlay-box { background: #1a1a1a; color: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; }
    #listaGiocatori { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 15px 0; }
    #listaGiocatori button { color: black; padding: 12px 5px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; }
 
    /* TABELLA PARTITA */
    #tabella-wrap {
      overflow-x: auto;
      margin-bottom: 8px;
      flex-shrink: 0;
      border-radius: 8px;
      background: #1a1a1a;
      padding: 10px;
    }
 
    #tabella-partita {
      border-collapse: collapse;
      font-size: 12px;
      width: auto;
      table-layout: auto;
      margin: 0 auto;
    }
 
    #tabella-partita td {
      border: 1px solid #2a4a6a;
      padding: 3px 5px;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
      min-width: 65px;
    }
 
    #tabella-partita td:first-child {
      background: #0b2a4a;
      font-weight: bold;
      text-align: left;
      padding-left: 7px;
      color: #f2c200;
    }
 
    #tabella-partita tr.riga-poligono td {
      background: rgba(242, 194, 0, 0.08);
    }
 
    #tabella-partita tr.riga-arrivo td {
      background: rgba(255, 255, 255, 0.07);
      font-weight: bold;
    }
 
    /* Wrapper dentro ogni cella dati */
    .cella-inner {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
 
    .cella-inner .cella-valore {
      font-weight: bold;
    }
 
    .cella-inner .btn-cancella {
      display: none;
      background: none;
      border: none;
      color: #888;
      font-size: 10px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
 
    .cella-inner.piena .btn-cancella {
      display: inline;
    }
 
    .cella-inner .btn-cancella:hover {
      color: #ef5350;
    }
 
    /* Colori valori — sovrascrivibili inline per colore giocatore */
    td.cella-scatto .cella-valore    { font-weight: bold; }
    td.cella-crisi .cella-valore     { font-weight: bold; }
    td.cella-punteggio .cella-valore { font-weight: bold; }
    td.cella-vittoria .cella-valore  { font-weight: bold; }
 
    @media (max-width: 400px) {
      #pulsanti { grid-template-columns: repeat(3, 1fr); }
      .hero h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
 
<header class="hero">
  <h1>TUTTI A SCUOLA DA <span>STURLA</span></h1>
  <button id="globalNuovaPartita" class="btn-reset">🔄 NUOVA PARTITA</button>
</header>
 
<main id="app">
  <section id="home">
    <div class="welcome-box" style="text-align: center; margin-top: 50px;">
      <p>Benvenuto! Configura i giocatori per iniziare.</p>
      <button class="btn-start" onclick="mostraSezione('setup')">INIZIA CONFIGURAZIONE</button>
    </div>
  </section>
 
  <section id="setup" class="hidden">
    <h2>Inserisci i giocatori</h2>
    <div class="poligoni-scelta">
      <p>Numero di poligoni:</p>
      <div class="poligoni-opzioni">
        <button id="btn-2-poligoni" class="selezionato" onclick="scegliPoligoni(2)">2 poligoni</button>
        <button id="btn-4-poligoni" onclick="scegliPoligoni(4)">4 poligoni</button>
      </div>
    </div>
    <div id="lista-input-giocatori"></div>
    <div class="setup-controls">
      <button id="btn-aggiungi-input" type="button">+ Aggiungi Giocatore</button>
      <button id="avvia" class="btn-start">AVVIA PARTITA</button>
    </div>
  </section>
 
  <section id="partita" class="hidden main-content">
    <div id="pulsanti">
      <button data-evento="partenza">Partenza</button>
      <button data-evento="0">0</button>
      <button data-evento="1">1</button>
      <button data-evento="2">2</button>
      <button data-evento="3">3</button>
      <button data-evento="4">4</button>
      <button data-evento="5">5</button>
      <button data-evento="scatto">Scatto</button>
      <button data-evento="crisi">Crisi</button>
      <button data-evento="vittoria">Arrivo</button>
      <button data-evento="vario">Vario</button>
    </div>
 
    <div id="tabella-wrap">
      <table id="tabella-partita"></table>
    </div>
 
    <div id="cronaca"></div>
  </section>
</main>
 
<div id="overlay" class="hidden">
  <div class="overlay-box">
    <h3>Scegli il giocatore</h3>
    <div id="listaGiocatori"></div>
    <button id="annulla">Annulla</button>
  </div>
</div>
 
<script>
  let giocatori = [];
  let frasi = null;
  let eventoAttivo = null;
  let audioQueue = [];
  let isPlaying = false;
  let numPoligoni = 2;
 
  function scegliPoligoni(n) {
    numPoligoni = n;
    document.getElementById("btn-2-poligoni").classList.toggle("selezionato", n === 2);
    document.getElementById("btn-4-poligoni").classList.toggle("selezionato", n === 4);
  }
 
  const coloriBase = [
    { hex: "#0066FF", name: "Blu"}, { hex: "#FF0000", name: "Rosso"}, { hex: "#FFFF00", name: "Giallo" },
    { hex: "#228B22", name: "Verde"}, { hex: "#9933FF", name: "Viola"}, { hex: "#8B5A2B", name: "Marrone" }
  ];
 
  const sections = {
    home: document.getElementById("home"),
    setup: document.getElementById("setup"),
    partita: document.getElementById("partita")
  };
 
  const cronaca = document.getElementById("cronaca");
  const overlay = document.getElementById("overlay");
  const containerGiocatori = document.getElementById("lista-input-giocatori");
 
  fetch("frasi.json")
    .then(r => r.json())
    .then(data => { frasi = data; })
    .catch(err => console.error("Errore JSON:", err));
 
  function mostraSezione(nome) {
    Object.values(sections).forEach(s => s.classList.add("hidden"));
    sections[nome].classList.remove("hidden");
    if(nome === 'setup' && containerGiocatori.children.length === 0) {
        creaCampoGiocatore();
        creaCampoGiocatore();
    }
  }
 
  document.getElementById("globalNuovaPartita").onclick = () => {
    if (confirm("Iniziare una nuova partita?")) {
      cronaca.innerHTML = "";
      containerGiocatori.innerHTML = "";
      audioQueue = [];
      document.getElementById("tabella-partita").innerHTML = "";
      statoGiocatori = [];
      contatoreVittoria = 0;
      mostraSezione("setup");
    }
  };
 
  function creaCampoGiocatore() {
    const div = document.createElement("div");
    div.className = "giocatore-row";
    const index = containerGiocatori.children.length;
    const colDefault = coloriBase[index % coloriBase.length].hex;
    const nomeColoreDefault = coloriBase[index % coloriBase.length].name; // Nome del colore
 
    div.innerHTML = `
          <input type="text" placeholder="Nome">
      <select class="select-colore" style="background:${colDefault}; color:#000000;" onchange="this.style.background=this.value;">
        ${coloriBase.map(c => `
          <option value="${c.hex}" ${c.hex === colDefault ? 'selected' : ''} style="background:${c.hex}; color:#000000;">
            ${c.name}
          </option>`).join("")}
      </select>
      <button type="button" style="background:#d62828; color:white; border:none; border-radius:5px; width:35px;" onclick="this.parentElement.remove()">×</button>
    `;
    containerGiocatori.appendChild(div);
  }
 
  document.getElementById("btn-aggiungi-input").onclick = () => creaCampoGiocatore();
 
  document.getElementById("avvia").onclick = () => {
    giocatori = [...containerGiocatori.querySelectorAll(".giocatore-row")].map(row => ({
      nome: row.querySelector("input").value.trim(),
      colore: row.querySelector(".select-colore").value
    })).filter(g => g.nome !== "");
    if (giocatori.length === 0) return alert("Aggiungi giocatori!");
    inizializzaTabella();
    mostraSezione("partita");
  };
 
  document.querySelectorAll("#pulsanti button").forEach(btn => {
    btn.onclick = () => {
      const ev = btn.getAttribute("data-evento");
      if (ev === "partenza" || ev === "vario") {
        aggiungiCronaca(ev, null);
      } else {
        eventoAttivo = ev;
        apriOverlayGiocatori();
      }
    };
  });
 
  function apriOverlayGiocatori() {
    const lista = document.getElementById("listaGiocatori");
    lista.innerHTML = "";
    giocatori.forEach(g => {
      const b = document.createElement("button");
      b.textContent = g.nome;
      b.style.backgroundColor = g.colore;
      b.onclick = () => {
        overlay.classList.add("hidden");
        aggiungiCronaca(eventoAttivo, g);
      };
      lista.appendChild(b);
    });
    overlay.classList.remove("hidden");
  }
 
  function aggiungiCronaca(evento, giocatoreObj) {
    let eventoPerFrase = evento;
    
    // Aggiorna tabella PRIMA (così contatoreVittoria è aggiornato)
    if (giocatoreObj) {
      const gIdx = giocatori.indexOf(giocatoreObj);
      if (evento === "scatto") {
        aggiornaCellaTabella(gIdx, "scatto", "S");
      } else if (evento === "crisi") {
        aggiornaCellaTabella(gIdx, "crisi", "C");
      } else if (["0","1","2","3","4","5"].includes(evento)) {
        aggiornaCellaTabella(gIdx, "poligono", evento);
      } else if (evento === "vittoria") {
        aggiornaCellaTabella(gIdx, "vittoria", "");
        // Dopo aggiornamento, contatoreVittoria è stato incrementato
        // Se è il primo (contatoreVittoria === 1), usa "vittoria", altrimenti "finegara"
        eventoPerFrase = contatoreVittoria === 1 ? "vittoria" : "finegara";
      }
    }
    
    // Ora seleziona la frase
    if (!frasi || !frasi[eventoPerFrase]) return;
    const set = frasi[eventoPerFrase];
    const frase = set[Math.floor(Math.random() * set.length)];
    const p = document.createElement("p");
    
    if (giocatoreObj) {
      p.textContent = `${giocatoreObj.nome} ${frase}`;
      p.style.color = giocatoreObj.colore;
      p.style.borderLeftColor = giocatoreObj.colore;
    } else {
      p.textContent = frase;
      p.style.color = "#ffffff";
      p.style.borderLeftColor = "#ffffff";
    }
    
    cronaca.appendChild(p);
    cronaca.scrollTop = cronaca.scrollHeight;
 
    // Audio: per "vittoria" solo se è il primo arrivato
    const skipAudio = evento === "vittoria" && contatoreVittoria > 1;
    if (!skipAudio && frasi.audioCounts && frasi.audioCounts[evento]) {
      const n = Math.floor(Math.random() * frasi.audioCounts[evento]) + 1;
      const nFormattato = n.toString().padStart(2, '0');
      audioQueue.push(`audio/${evento}/${evento}-${nFormattato}.mp3`);
      if (!isPlaying) playNextAudio();
    }
  }
 
  function playNextAudio() {
    if (audioQueue.length === 0) { isPlaying = false; return; }
    isPlaying = true;
    const audio = new Audio(audioQueue.shift());
    audio.onended = playNextAudio;
    audio.play().catch(() => playNextAudio());
  }
 
  // --- LOGICA TABELLA ---
 
  let statoGiocatori = [];
  let contatoreVittoria = 0;
 
  function righeTabella() {
    if (numPoligoni === 2) {
      return [
        { label: "Giocatori", tipo: "intestazione" },
        { label: "Giro 1",    tipo: "giro",     indice: 0 },
        { label: "Poligono 1",tipo: "poligono", indice: 0 },
        { label: "Giro 2",    tipo: "giro",     indice: 1 },
        { label: "Poligono 2",tipo: "poligono", indice: 1 },
        { label: "Giro 3",    tipo: "giro",     indice: 2 },
        { label: "Arrivo",    tipo: "arrivo"              }
      ];
    } else {
      return [
        { label: "Giocatori", tipo: "intestazione" },
        { label: "Giro 1",    tipo: "giro",     indice: 0 },
        { label: "Poligono 1",tipo: "poligono", indice: 0 },
        { label: "Giro 2",    tipo: "giro",     indice: 1 },
        { label: "Poligono 2",tipo: "poligono", indice: 1 },
        { label: "Giro 3",    tipo: "giro",     indice: 2 },
        { label: "Poligono 3",tipo: "poligono", indice: 2 },
        { label: "Giro 4",    tipo: "giro",     indice: 3 },
        { label: "Poligono 4",tipo: "poligono", indice: 3 },
        { label: "Giro 5",    tipo: "giro",     indice: 4 },
        { label: "Arrivo",    tipo: "arrivo"              }
      ];
    }
  }
 
  // Ricava lo stato di un giocatore leggendo direttamente le celle della tabella
  function ricalcolaStato(gIdx) {
    const righe = righeTabella();
    let poligoniCompletati = 0;
    let vittoria = false;
 
    righe.forEach((riga, rigaIdx) => {
      if (riga.tipo === "poligono") {
        const cella = document.getElementById(`cella-${gIdx}-r${rigaIdx}`);
        if (cella && cella.dataset.valore) poligoniCompletati++;
      }
      if (riga.tipo === "arrivo") {
        const cella = document.getElementById(`cella-${gIdx}-r${rigaIdx}`);
        if (cella && cella.dataset.valore) vittoria = true;
      }
    });
 
    statoGiocatori[gIdx].poligoniCompletati = poligoniCompletati;
 
    // Ricalcola contatoreVittoria leggendo tutte le celle arrivo
    const rigaArrivo = righe.find(r => r.tipo === "arrivo");
    const rigaArrivoIdx = righe.indexOf(rigaArrivo);
    let cnt = 0;
    giocatori.forEach((_, i) => {
      const c = document.getElementById(`cella-${i}-r${rigaArrivoIdx}`);
      if (c && c.dataset.valore) cnt++;
    });
    contatoreVittoria = cnt;
  }
 
  function scriviCella(cella, classeColore, valore, coloreGiocatore) {
    cella.className = classeColore;
    cella.dataset.valore = valore;
    cella.innerHTML = "";
    const inner = document.createElement("span");
    inner.className = "cella-inner piena";
    const span = document.createElement("span");
    span.className = "cella-valore";
    span.textContent = valore;
    if (coloreGiocatore) span.style.color = coloreGiocatore;
    const btnX = document.createElement("button");
    btnX.className = "btn-cancella";
    btnX.textContent = "×";
    btnX.title = "Cancella";
    btnX.onclick = (e) => {
      e.stopPropagation();
      const gIdx = parseInt(cella.id.split("-")[1]);
      cancellaCella(cella, gIdx);
    };
    inner.appendChild(span);
    inner.appendChild(btnX);
    cella.appendChild(inner);
  }
 
  function cancellaCella(cella, gIdx) {
    cella.className = "";
    cella.dataset.valore = "";
    cella.innerHTML = "";
    // Ricalcola lo stato del giocatore in base a ciò che rimane nella tabella
    ricalcolaStato(gIdx);
    // Se era una cella arrivo, riassegna le posizioni a tutti
    const righe = righeTabella();
    const rigaArrivoIdx = righe.findIndex(r => r.tipo === "arrivo");
    // Controlla se la cella cancellata era una cella arrivo
    const idParts = cella.id.split("-");
    const rigaIdx = parseInt(idParts[2].replace("r", ""));
    if (rigaIdx === rigaArrivoIdx) {
      riassegnaVittorie();
    }
  }
 
  function riassegnaVittorie() {
    const righe = righeTabella();
    const rigaArrivoIdx = righe.findIndex(r => r.tipo === "arrivo");
    const celle = giocatori.map((_, i) => document.getElementById(`cella-${i}-r${rigaArrivoIdx}`));
    const compilate = celle.filter(c => c && c.dataset.valore);
    compilate.sort((a, b) => parseInt(a.dataset.valore) - parseInt(b.dataset.valore));
    celle.forEach(c => { if (c) { c.className = ""; c.dataset.valore = ""; c.innerHTML = ""; } });
    const pos = ["1°","2°","3°","4°","5°","6°"];
    compilate.forEach((c, i) => {
      const gIdx = parseInt(c.id.split("-")[1]);
      scriviCella(c, "cella-vittoria", pos[i] || `${i+1}°`, giocatori[gIdx].colore);
    });
    contatoreVittoria = compilate.length;
  }
 
  function inizializzaTabella() {
    contatoreVittoria = 0;
    statoGiocatori = giocatori.map(() => ({
      poligoniCompletati: 0
    }));
 
    const tabella = document.getElementById("tabella-partita");
    tabella.innerHTML = "";
    const righe = righeTabella();
 
    righe.forEach((riga, rigaIdx) => {
      const tr = document.createElement("tr");
      if (riga.tipo === "poligono") tr.classList.add("riga-poligono");
      if (riga.tipo === "arrivo")   tr.classList.add("riga-arrivo");
 
      const tdLabel = document.createElement("td");
      tdLabel.textContent = riga.label;
      tr.appendChild(tdLabel);
 
      giocatori.forEach((g, gIdx) => {
        const td = document.createElement("td");
        td.id = `cella-${gIdx}-r${rigaIdx}`;
        td.dataset.valore = "";
        if (riga.tipo === "intestazione") {
          td.textContent = g.nome;
          td.style.color = g.colore;
          td.style.fontWeight = "bold";
        }
        tr.appendChild(td);
      });
 
      tabella.appendChild(tr);
    });
  }
 
  function aggiornaCellaTabella(gIdx, tipo, valore) {
    const righe = righeTabella();
    const colore = giocatori[gIdx].colore;
 
    if (tipo === "scatto" || tipo === "crisi") {
      const indiceGiro = statoGiocatori[gIdx].poligoniCompletati;
      const rigaIdx = righe.findIndex(r => r.tipo === "giro" && r.indice === indiceGiro);
      if (rigaIdx === -1) return;
      const cella = document.getElementById(`cella-${gIdx}-r${rigaIdx}`);
      if (!cella) return;
      scriviCella(cella, valore === "S" ? "cella-scatto" : "cella-crisi", valore, colore);
 
    } else if (tipo === "poligono") {
      const indice = statoGiocatori[gIdx].poligoniCompletati;
      if (indice >= numPoligoni) return;
      const rigaIdx = righe.findIndex(r => r.tipo === "poligono" && r.indice === indice);
      if (rigaIdx === -1) return;
      const cella = document.getElementById(`cella-${gIdx}-r${rigaIdx}`);
      if (!cella) return;
      scriviCella(cella, "cella-punteggio", valore, colore);
      statoGiocatori[gIdx].poligoniCompletati++;
 
    } else if (tipo === "vittoria") {
      const rigaIdx = righe.findIndex(r => r.tipo === "arrivo");
      if (rigaIdx === -1) return;
      const cella = document.getElementById(`cella-${gIdx}-r${rigaIdx}`);
      if (!cella || cella.dataset.valore) return;
      contatoreVittoria++;
      const pos = ["1°","2°","3°","4°","5°","6°"];
      scriviCella(cella, "cella-vittoria", pos[contatoreVittoria - 1] || `${contatoreVittoria}°`, colore);
    }
  }
 
  document.getElementById("annulla").onclick = () => overlay.classList.add("hidden");
</script>
</body>
</html>
